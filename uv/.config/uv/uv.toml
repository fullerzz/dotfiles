python-downloads = "automatic"
python-preference = "system"
link-mode = "hardlink"
exclude-newer = "18 hours"
preview-features = [
  "adjust-ulimit",
  "audit-command",
  "cache-physical-space",
  "cache-size",
  "check-command",
  "format-command",
  "malware-check",
  "native-auth",
  "json-output",
  "tool-install-locks",
  "venv-safe-clear"
]

[pip]
strict = true
verify-hashes = true
link-mode = "hardlink"

