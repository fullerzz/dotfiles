[env]
NODE_ENV = 'production'

[tools]
go = "1.26"
usage = "latest"
zig = "0.16"
slsa-verifier = "latest"
minisign = "latest"
fnox = "latest"
aube = "latest"
prettier = "latest"
"npm:codex-wakatime" = "latest"
"npm:@usebruno/cli" = { version = "latest", pnpm_args = "--allow-build=@usebruno/cli --config.node-linker=hoisted" }
node = ["24", "lts"]
rust = "latest"
lazygit = "0.62.2"
"cargo:difftastic" = "0.69.0"
zoxide = "0.9.9"
neovim = "0.12.3"
starship = "latest"
"cargo:mergiraf" = "latest"
bat = "latest"

[tasks.build]
run = 'echo "running build tasks"'

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node"]
lockfile = false
python.uv_venv_auto = "source"

gpg_verify = true
trusted_config_paths = ["~/Code/*"]
disable_backends = ["ubi", "asdf"]

[settings.npm]
package_manager = "pnpm"
